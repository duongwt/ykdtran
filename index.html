<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>100 Days With You</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
color:white;
overflow:hidden;
}

/* MAIN PAGE */

#main{
position:fixed;
width:100%;
height:100%;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

/* INTRO SCREEN */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:34px;
transition:opacity 3s;
}

#text{
transition:opacity 2s;
}

.hidden{
opacity:0;
}

.fadeOut{
opacity:0;
pointer-events:none;
}

/* MAIN TEXT */

h1{
font-size:64px;
margin:0;
}

p{
font-size:24px;
margin-top:20px;
}

/* HEART ANIMATION */

.heart{
position:fixed;
bottom:-50px;
font-size:20px;
animation:float 8s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{
transform:translateY(0) translateX(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-100vh) translateX(50px);
opacity:0;
}
}

</style>
</head>

<body>

<!-- MAIN PAGE -->

<div id="main">

<h1>100 Days With You ❤️</h1>

<p>
Thank you for being in my life.<br>
These 100 days mean the world to me.
</p>

</div>

<!-- INTRO -->

<div id="intro">

<div id="text">

Please use a computer<br>
and turn on your sound 🎧

</div>

</div>

<!-- MUSIC -->

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const text = document.getElementById("text")
const intro = document.getElementById("intro")
const music = document.getElementById("music")

/* MESSAGE 1 */

setTimeout(()=>{
text.classList.add("hidden")
},3000)

/* MESSAGE 2 */

setTimeout(()=>{
text.innerHTML="For the best experience..."
text.classList.remove("hidden")
},5000)

/* MESSAGE 3 */

setTimeout(()=>{
text.classList.add("hidden")
},8000)

/* TYPING EFFECT */

function typeWriter(message, speed){

text.innerHTML=""
let i=0

function typing(){

if(i<message.length){
text.innerHTML+=message.charAt(i)
i++
setTimeout(typing,speed)
}

}

typing()

}

/* MESSAGE 4 */

setTimeout(()=>{

text.classList.remove("hidden")

typeWriter("I made something for you...",80)

/* start music */

music.volume=0
music.play()

let fade=setInterval(()=>{

if(music.volume<0.5){
music.volume+=0.02
}else{
clearInterval(fade)
}

},200)

},10000)

/* REMOVE TEXT */

setTimeout(()=>{
text.classList.add("hidden")
},13500)

/* FADE INTRO */

setTimeout(()=>{
intro.classList.add("fadeOut")
startHearts()
},15500)

/* HEART GENERATOR */

function createHeart(){

const heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"vw"
heart.style.fontSize=(15+Math.random()*25)+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},8000)

}

function startHearts(){

setInterval(createHeart,800)

}

</script>

</body>
</html>
