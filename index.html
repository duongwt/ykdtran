<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>100 Days With You</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
}

/* intro screen */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:32px;
}

/* text animation */

.fade{
opacity:0;
transition:opacity 2s;
}

.show{
opacity:1;
}

/* main page */

#main{
display:none;
height:100vh;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

h1{
font-size:60px;
}

</style>
</head>

<body>

<div id="intro">
<div id="text" class="show">
Please use a computer<br>
and turn on your sound 🎧
</div>
</div>

<div id="main">

<h1>100 Days With You ❤️</h1>
<p>Thank you for being in my life</p>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const text = document.getElementById("text");
const music = document.getElementById("music");

/* step 1 */

setTimeout(()=>{
text.classList.remove("show");
text.classList.add("fade");
},3000);

/* step 2 */

setTimeout(()=>{
text.innerHTML="For the best experience...";
text.classList.remove("fade");
text.classList.add("show");
},5000);

/* step 3 */

setTimeout(()=>{
text.classList.remove("show");
text.classList.add("fade");
},8000);

/* step 4 */

setTimeout(()=>{
text.innerHTML="I made something for you...";
text.classList.remove("fade");
text.classList.add("show");
music.play();
},10000);

/* step 5 */

setTimeout(()=>{
text.classList.remove("show");
text.classList.add("fade");
},13000);

/* step 6 */

setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="flex";
},15000);

</script>

</body>
</html>
