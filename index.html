<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>100 Days With You</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow:hidden;
}

/* intro screen */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:28px;
text-align:center;
}

/* hidden text */

.hidden{
opacity:0;
transition:2s;
}

/* show text */

.show{
opacity:1;
}

/* main page */

#main{
display:none;
height:100vh;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

h1{
font-size:60px;
}

</style>
</head>

<body>

<div id="intro">

<div id="message1">
Please use a computer<br>
and turn on your sound 🎧
</div>

<div id="message2" class="hidden">
For the best experience...
</div>

</div>

<div id="main">

<h1>100 Days With You ❤️</h1>
<p>Thank you for being in my life</p>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

setTimeout(()=>{
document.getElementById("message1").classList.add("hidden");
document.getElementById("message2").classList.add("show");
},3000);

setTimeout(()=>{
document.getElementById("music").play();
},5000);

setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("main").style.display="flex";
},8000);

</script>

</body>
</html>
