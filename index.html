<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>100 Days With You</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
color:white;
overflow:hidden;
}

/* MAIN PAGE */

#main{
position:fixed;
width:100%;
height:100%;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
overflow:auto;
}

/* INTRO SCREEN */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:34px;
transition:opacity 3s;
}

#text{
transition:opacity 2s;
}

.hidden{
opacity:0;
}

.fadeOut{
opacity:0;
pointer-events:none;
}

/* MAIN TEXT */

h1{
font-size:64px;
margin-top:40px;
}

p{
font-size:22px;
}

/* HEARTS */

.heart{
position:fixed;
bottom:-50px;
font-size:20px;
animation:float 8s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(0);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-100vh) translateX(50px);opacity:0;}
}

/* GALLERY */

.slider{
width:350px;
height:350px;
position:relative;
margin-top:20px;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:opacity 1s;
border-radius:20px;
}

.slide.active{
opacity:1;
}

/* COUNTER */

#counter{
font-size:32px;
margin-top:10px;
}

</style>
</head>

<body>

<!-- MAIN PAGE -->

<div id="main">

<h1>100 Days With You ❤️</h1>

<p>
Thank you for being in my life.<br>
These days with you mean the world to me.
</p>

<h2>Our Memories 📸</h2>

<div class="slider">

<img src="photo1.jpg" class="slide active">
<img src="photo2.jpg" class="slide">
<img src="photo3.jpg" class="slide">
<img src="photo4.jpg" class="slide">

</div>

<h2>We've been together for</h2>

<div id="counter"></div>

</div>

<!-- INTRO -->

<div id="intro">
<div id="text">
Please use a computer <br>
and turn on your sound 🎧
</div>
</div>

<!-- MUSIC -->

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const text=document.getElementById("text")
const intro=document.getElementById("intro")
const music=document.getElementById("music")

/* INTRO FLOW */

setTimeout(()=>{
text.classList.add("hidden")
},3000)

setTimeout(()=>{
text.innerHTML="For the best experience..."
text.classList.remove("hidden")
},5000)

setTimeout(()=>{
text.classList.add("hidden")
},8000)

/* TYPING EFFECT */

function typeWriter(message,speed){

text.innerHTML=""
let i=0

function typing(){

if(i<message.length){
text.innerHTML+=message.charAt(i)
i++
setTimeout(typing,speed)
}

}

typing()

}

setTimeout(()=>{

text.classList.remove("hidden")
typeWriter("I made something for you...",80)

/* MUSIC FADE IN */

music.volume=0
music.play()

let fade=setInterval(()=>{

if(music.volume<0.5){
music.volume+=0.02
}else{
clearInterval(fade)
}

},200)

},10000)

setTimeout(()=>{
text.classList.add("hidden")
},13500)

setTimeout(()=>{
intro.classList.add("fadeOut")
startHearts()
},15500)

/* HEARTS */

function createHeart(){

const heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"vw"
heart.style.fontSize=(15+Math.random()*25)+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},8000)

}

function startHearts(){
setInterval(createHeart,800)
}

/* SLIDER */

let slides=document.querySelectorAll(".slide")
let index=0

function showSlide(){

slides[index].classList.remove("active")

index=(index+1)%slides.length

slides[index].classList.add("active")

}

setInterval(showSlide,4000)

/* LOVE COUNTER */

const startDate=new Date("2024-12-01") // sửa ngày bắt đầu yêu

function updateCounter(){

const now=new Date()
const diff=now-startDate

const days=Math.floor(diff/(1000*60*60*24))

document.getElementById("counter").innerHTML=
days+" days ❤️"

}

updateCounter()
setInterval(updateCounter,60000)

</script>

</body>
</html>
