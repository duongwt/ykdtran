<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>100 Days With You</title>

<style>

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial;
color:white;
overflow-x:hidden;
}

/* INTRO */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
text-align:center;
z-index:10;
transition:opacity 2s;
}

.hidden{
opacity:0;
}

/* HERO PAGE */

#hero{

height:100vh;

background-image:url("background.jpg");
background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;

}

h1{
font-size:70px;
margin:0;
}

p{
font-size:22px;
}

/* HEARTS */

.heart{
position:fixed;
bottom:-20px;
animation:float 8s linear infinite;
opacity:0.7;
}

@keyframes float{

0%{transform:translateY(0);opacity:0}

20%{opacity:1}

100%{
transform:translateY(-100vh) translateX(40px);
opacity:0
}

}

/* SCROLL SECTION */

#memories{

background:black;
padding:120px 0;
text-align:center;

}

/* GALLERY */

.slider{

width:350px;
height:350px;
margin:auto;
position:relative;

}

.slide{

position:absolute;
width:100%;
height:100%;
object-fit:cover;

opacity:0;
transition:opacity 1s;

border-radius:20px;

}

.slide.active{
opacity:1;
}

/* COUNTER */

#counter{

font-size:35px;
margin-top:30px;

}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

<div id="text">

Click anywhere<br>
Turn on your sound 🎧

</div>

</div>


<!-- HERO -->

<section id="hero">

<h1>100 Days With You ❤️</h1>

<p>
Thank you for being in my life.<br>
These days with you mean the world to me.
</p>

</section>


<!-- MEMORIES -->

<section id="memories">

<h2>Our Memories 📸</h2>

<div class="slider">

<img src="photo1.jpg" class="slide active">
<img src="photo2.jpg" class="slide">
<img src="photo3.jpg" class="slide">
<img src="photo4.jpg" class="slide">

</div>


<h2>We've been together for</h2>

<div id="counter"></div>

</section>


<!-- MUSIC -->

<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>


<script>

const intro = document.getElementById("intro")
const text = document.getElementById("text")
const music = document.getElementById("music")


/* CLICK TO START */

document.body.addEventListener("click",startExperience,{once:true})


function startExperience(){

typeWriter("I made something for you...",80)

music.volume=0
music.play()

let fade=setInterval(()=>{

if(music.volume<0.5){
music.volume+=0.02
}else{
clearInterval(fade)
}

},200)


setTimeout(()=>{

intro.classList.add("hidden")

setTimeout(()=>{
intro.style.display="none"
},2000)

startHearts()

},4500)

}


/* TYPING EFFECT */

function typeWriter(textMessage,speed){

text.innerHTML=""

let i=0

function typing(){

if(i<textMessage.length){

text.innerHTML+=textMessage.charAt(i)

i++

setTimeout(typing,speed)

}

}

typing()

}


/* HEARTS */

function createHeart(){

const heart=document.createElement("div")

heart.className="heart"

heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"vw"

heart.style.fontSize=(15+Math.random()*25)+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},8000)

}

function startHearts(){

setInterval(createHeart,700)

}


/* GALLERY */

let slides=document.querySelectorAll(".slide")

let index=0

setInterval(()=>{

slides[index].classList.remove("active")

index=(index+1)%slides.length

slides[index].classList.add("active")

},4000)


/* LOVE COUNTER */

const startDate=new Date("2025-12-24")

function updateCounter(){

const now=new Date()

const diff=now-startDate

const days=Math.floor(diff/(1000*60*60*24))

document.getElementById("counter").innerHTML=days+" days ❤️"

}

updateCounter()

setInterval(updateCounter,60000)

</script>

</body>
</html>
