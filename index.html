<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>100 Days With You</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
overflow:hidden;
}

/* MAIN PAGE */

#main{
position:fixed;
width:100%;
height:100%;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

/* INTRO OVERLAY */

#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:34px;
transition:opacity 3s;
}

.fadeOut{
opacity:0;
pointer-events:none;
}

/* TEXT ANIMATION */

#text{
transition:opacity 2s;
}

.hidden{
opacity:0;
}

</style>
</head>

<body>

<div id="main">

<h1>100 Days With You ❤️</h1>
<p>Thank you for being in my life</p>

</div>

<div id="intro">
<div id="text">
Please use a computer<br>
and turn on your sound 🎧
</div>
</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const text = document.getElementById("text")
const intro = document.getElementById("intro")
const music = document.getElementById("music")

/* message 1 */

setTimeout(()=>{
text.classList.add("hidden")
},3000)

/* message 2 */

setTimeout(()=>{
text.innerHTML="For the best experience..."
text.classList.remove("hidden")
},5000)

/* message 3 */

setTimeout(()=>{
text.classList.add("hidden")
},8000)

/* message 4 */

setTimeout(()=>{
text.innerHTML="I made something for you..."
text.classList.remove("hidden")
music.play()
},10000)

/* remove text */

setTimeout(()=>{
text.classList.add("hidden")
},13000)

/* fade into main page */

setTimeout(()=>{
intro.classList.add("fadeOut")
},15000)

</script>

</body>
</html>
